<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tycoon Multijugador</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tycoon Multijugador</h1>

    <div id="login">
        <input type="text" id="playerName" placeholder="Nombre del personaje">
        <button onclick="login()">Entrar al juego</button>
    </div>

    <div id="game" style="display:none;">
        <p id="welcome"></p>
        <p id="money"></p>
        <p id="level"></p>
        <p id="income"></p>

        <button onclick="earnMoney()">Vender café</button>
        <button onclick="upgradeBusiness()">Mejorar negocio ($100)</button>

        <h2>Ranking</h2>
        <ul id="ranking"></ul>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="script.js"></script>
</body>
</html>
