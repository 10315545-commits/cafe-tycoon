<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tycoon Simple</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Tycoon Simple</h1>

<!-- Login -->
<div id="login">
    <input type="text" id="playerName" placeholder="Nombre del jugador">
    <p>Elige avatar:</p>
    <div id="avatars">
        <img class="avatarOption" src="images/avatar1.png" onclick="selectAvatar('avatar1.png')">
        <img class="avatarOption" src="images/avatar2.png" onclick="selectAvatar('avatar2.png')">
        <img class="avatarOption" src="images/avatar3.png" onclick="selectAvatar('avatar3.png')">
    </div>
    <button onclick="login()">Entrar</button>
</div>

<!-- Juego -->
<div id="game" style="display:none;">
    <p id="welcome"></p>
    <div id="gameArea"></div>

    <!-- Controles -->
    <div id="controls">
        <button onclick="move('up')">⬆️</button><br>
        <button onclick="move('left')">⬅️</button>
        <button onclick="move('down')">⬇️</button>
        <button onclick="move('right')">➡️</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
